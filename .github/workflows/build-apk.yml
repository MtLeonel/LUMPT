name: Gerar APK do Lumpt
on:
  workflow_dispatch:
  push:
    branches: [lumpt-apk-build]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: lumpt-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK na branch lumpt-apk-out
        run: |
          mkdir -p /tmp/out && cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/out/Lumpt.apk
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout --orphan lumpt-apk-out && git rm -rfq . && cp /tmp/out/Lumpt.apk . && git add Lumpt.apk
          git commit -qm "APK do Lumpt" && git push -f origin lumpt-apk-out
